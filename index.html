<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>アプリ プライバシーポリシー・サポート</title>
<style>
  :root {
    --base: #F0F0F3;
    --light: #FFFFFF;
    --shade-solid: #A3B1C6;
    --ink: #1C1C1E;
    --sub: #8E929C;
    --body: #3C3E44;
    --primary: #1D5B99;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--base);
    color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: clamp(28px, 6vw, 72px) clamp(18px, 6vw, 40px) 80px;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 36px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .lead {
    font-size: 14px;
    line-height: 1.8;
    color: var(--sub);
    margin: 0;
  }
  .app-card {
    display: block;
    text-decoration: none;
    background: var(--base);
    border-radius: 20px;
    padding: 22px 24px;
    margin-top: 18px;
    box-shadow: 8px 8px 18px var(--shade-solid), -8px -8px 18px var(--light);
    transition: box-shadow 0.15s ease;
  }
  .app-card:hover {
    box-shadow: 5px 5px 12px var(--shade-solid), -5px -5px 12px var(--light);
  }
  .app-name {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 19px;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .app-desc {
    font-size: 13px;
    color: var(--body);
    margin: 0;
  }
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--sub);
    margin-top: 44px;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>プライバシーポリシー・サポート</h1>
    <p class="lead">各アプリのプライバシーポリシー兼サポートページの一覧です。</p>
  </header>

  <a class="app-card" href="./te-ssera/">
    <p class="app-name">te-ssera</p>
    <p class="app-desc">タイル分解で暗算を体に入れるトレーニングアプリ</p>
  </a>

  <footer>&copy; tomo-tiro</footer>
</main>
</body>
</html>
